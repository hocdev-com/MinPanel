<section class="card status-shell" id="disks" data-i18n-auto>
  <div class="card-head">
    <h2 data-i18n="dashboard.sys_status"></h2>
  </div>
  <div class="grid status-grid">
    <article class="card status-card" tabindex="0">
      <div class="meter-wrap">
        <div class="status-title" data-i18n="dashboard.load_status"></div>
        <div class="meter" id="load-meter" style="--accent-color: #20a53a">
          <strong id="load-meter-value">0%</strong>
        </div>
        <div class="status-summary" id="load-summary" data-i18n="dashboard.preparing"></div>
        <div class="status-copy">
          <h3 data-i18n="dashboard.load_status"></h3>
          <p id="load-label">0.00</p>
          <small id="load-detail" data-i18n="dashboard.load_average_initial"></small>
          <div class="status-hover-panel" role="tooltip">
            <div class="status-hover-arrow" aria-hidden="true"></div>
            <div class="status-hover-row status-hover-head">
              <span data-i18n="dashboard.detected_load"></span>
              <strong id="load-hover-usage" data-i18n="dashboard.usage_initial"></strong>
            </div>
            <div class="status-hover-section" data-i18n="dashboard.basic_information"></div>
            <div class="status-hover-line" id="load-hover-basic" data-i18n="dashboard.load_average_initial"></div>
            <div class="status-hover-divider"></div>
            <div class="status-hover-row">
              <span data-i18n="dashboard.load_average"></span>
              <strong id="load-hover-core">--</strong>
            </div>
            <div class="status-hover-section status-hover-footer">
              <span data-i18n="dashboard.top_process"></span>
              <strong data-i18n="dashboard.expand"></strong>
            </div>
          </div>
        </div>
      </div>
    </article>

    <article class="card status-card" tabindex="0">
      <div class="meter-wrap">
        <div class="status-title" data-i18n="dashboard.cpu_usage"></div>
        <div class="meter" id="cpu-meter" style="--accent-color: #20a53a">
          <strong id="cpu-meter-value">0%</strong>
        </div>
        <div class="status-summary" id="cpu-summary" data-i18n="dashboard.preparing"></div>
        <div class="status-copy">
          <h3 data-i18n="dashboard.cpu"></h3>
          <p id="cpu-label">0%</p>
          <small id="cpu-detail" data-i18n="dashboard.preparing_processor"></small>
          <div class="status-hover-panel" role="tooltip">
            <div class="status-hover-arrow" aria-hidden="true"></div>
            <div class="status-hover-row status-hover-head">
              <span data-i18n="dashboard.detected_cpu"></span>
              <strong id="cpu-hover-usage" data-i18n="dashboard.usage_initial"></strong>
            </div>
            <div class="status-hover-section" data-i18n="dashboard.basic_information"></div>
            <div class="status-hover-line" id="cpu-hover-basic" data-i18n="dashboard.preparing_processor"></div>
            <div class="status-hover-line" id="cpu-hover-core">--</div>
            <div class="status-hover-divider"></div>
            <div class="status-hover-row">
              <span data-i18n="dashboard.alarm"></span>
              <strong data-i18n="nav.settings"></strong>
            </div>
            <div class="status-hover-section status-hover-footer">
              <span data-i18n="dashboard.top_cpu_process"></span>
              <strong data-i18n="dashboard.expand"></strong>
            </div>
          </div>
        </div>
      </div>
    </article>

    <article class="card status-card" tabindex="0">
      <div class="meter-wrap">
        <div class="status-title" data-i18n="dashboard.ram_usage"></div>
        <div class="meter" id="memory-meter" style="--accent-color: #20a53a">
          <strong id="memory-meter-value">0%</strong>
        </div>
        <div class="status-summary" id="memory-summary" data-i18n="dashboard.preparing"></div>
        <div class="status-copy">
          <h3 data-i18n="dashboard.memory"></h3>
          <p id="memory-label">0%</p>
          <small id="memory-detail" data-i18n="dashboard.preparing_memory"></small>
          <div class="status-hover-panel" role="tooltip">
            <div class="status-hover-arrow" aria-hidden="true"></div>
            <div class="status-hover-row status-hover-head">
              <span data-i18n="dashboard.detected_memory"></span>
              <strong id="memory-hover-usage" data-i18n="dashboard.usage_initial"></strong>
            </div>
            <div class="status-hover-section" data-i18n="dashboard.basic_information"></div>
            <div class="status-hover-line" id="memory-hover-basic" data-i18n="dashboard.preparing_memory"></div>
            <div class="status-hover-divider"></div>
            <div class="status-hover-row">
              <span data-i18n="dashboard.memory_status"></span>
              <strong id="memory-hover-core">--</strong>
            </div>
            <div class="status-hover-section status-hover-footer">
              <span data-i18n="dashboard.top_memory_process"></span>
              <strong data-i18n="dashboard.expand"></strong>
            </div>
          </div>
        </div>
      </div>
    </article>

    <article class="card status-card" tabindex="0">
      <div class="meter-wrap">
        <div class="status-title" data-i18n="dashboard.disk_usage"></div>
        <div class="meter" id="disk-meter" style="--accent-color: #20a53a">
          <strong id="disk-meter-value">0%</strong>
        </div>
        <div class="status-summary" id="disk-summary" data-i18n="dashboard.preparing"></div>
        <div class="status-copy">
          <h3 id="disk-title">/</h3>
          <p id="disk-label">0%</p>
          <small id="disk-detail" data-i18n="dashboard.preparing_disk"></small>
          <div class="status-hover-panel" role="tooltip">
            <div class="status-hover-arrow" aria-hidden="true"></div>
            <div class="status-hover-row status-hover-head">
              <span data-i18n="dashboard.detected_disk"></span>
              <strong id="disk-hover-usage" data-i18n="dashboard.usage_initial"></strong>
            </div>
            <div class="status-hover-section" data-i18n="dashboard.basic_information"></div>
            <div class="status-hover-line" id="disk-hover-basic" data-i18n="dashboard.preparing_disk"></div>
            <div class="status-hover-divider"></div>
            <div class="status-hover-row">
              <span data-i18n="dashboard.mount_point"></span>
              <strong id="disk-hover-core">--</strong>
            </div>
            <div class="status-hover-section status-hover-footer">
              <span data-i18n="dashboard.top_disk_process"></span>
              <strong data-i18n="dashboard.expand"></strong>
            </div>
          </div>
        </div>
      </div>
    </article>

    <article class="card status-card" tabindex="0">
      <div class="meter-wrap">
        <div class="status-title" data-i18n="dashboard.disk_usage"></div>
        <div class="meter" id="disk-extra-meter" style="--accent-color: #20a53a">
          <strong id="disk-extra-meter-value">0%</strong>
        </div>
        <div class="status-summary" id="disk-extra-summary" data-i18n="dashboard.preparing"></div>
        <div class="status-copy">
          <h3 id="disk-extra-title" data-i18n="nav.disk"></h3>
          <p id="disk-extra-label">0%</p>
          <small id="disk-extra-detail" data-i18n="dashboard.preparing_disk"></small>
          <div class="status-hover-panel" role="tooltip">
            <div class="status-hover-arrow" aria-hidden="true"></div>
            <div class="status-hover-row status-hover-head">
              <span data-i18n="dashboard.detected_disk"></span>
              <strong id="disk-extra-hover-usage" data-i18n="dashboard.usage_initial"></strong>
            </div>
            <div class="status-hover-section" data-i18n="dashboard.basic_information"></div>
            <div class="status-hover-line" id="disk-extra-hover-basic" data-i18n="dashboard.preparing_disk"></div>
            <div class="status-hover-divider"></div>
            <div class="status-hover-row">
              <span data-i18n="dashboard.mount_point"></span>
              <strong id="disk-extra-hover-core">--</strong>
            </div>
            <div class="status-hover-section status-hover-footer">
              <span data-i18n="dashboard.top_disk_process"></span>
              <strong data-i18n="dashboard.expand"></strong>
            </div>
          </div>
        </div>
      </div>
    </article>
  </div>
</section>

<section class="card overview-card" id="overview">
  <div class="card-head">
    <h2 data-i18n="dashboard.overview"></h2>
  </div>
  <div class="overview-grid">
    <article class="overview-item">
      <span data-i18n="nav.website"></span>
      <strong class="overview-value is-good" id="overview-site-count">0</strong>
      <i aria-hidden="true"></i>
    </article>
    <article class="overview-item">
      <span data-i18n="nav.database"></span>
      <strong class="overview-value is-good" id="overview-db-count">0</strong>
      <i aria-hidden="true"></i>
    </article>
    <article class="overview-item">
      <span data-i18n="dashboard.security_risk_title"></span>
      <strong class="overview-value is-danger" id="overview-security-count">0</strong>
      <i aria-hidden="true"></i>
    </article>
    <article class="overview-item">
      <span data-i18n="dashboard.backup_record"></span>
      <small data-i18n="dashboard.current_content_empty"></small>
    </article>
  </div>
</section>

<section class="grid split-grid dashboard-split-grid">
  <article class="card software-card" id="software">
    <div class="card-head software-head">
      <h2 data-i18n="dashboard.software"></h2>
      <span data-i18n="dashboard.installed_software_overview"></span>
    </div>
    <div class="software-list" id="software-list"></div>
  </article>

  <article class="card traffic-card" id="traffic">
    <div class="traffic-toolbar">
      <div class="traffic-tabs" role="tablist" aria-label="" data-i18n-attr="aria-label:dashboard.traffic_metrics">
        <button class="traffic-tab active" type="button" data-traffic-tab="traffic" aria-selected="true" data-i18n="dashboard.traffic"></button>
        <button class="traffic-tab" type="button" data-traffic-tab="disk" aria-selected="false" data-i18n="dashboard.disk_io"></button>
      </div>
      <label class="traffic-select traffic-network-select">
        <span class="sr-only" data-i18n="dashboard.network_interface"></span>
        <select id="traffic-network-select" aria-label="" data-i18n-attr="aria-label:dashboard.network_interface">
          <option value="all" data-i18n="dashboard.net_all"></option>
        </select>
      </label>
    </div>
    <div class="traffic-panel" data-traffic-panel="traffic">
      <div class="traffic-meta">
        <div class="traffic-meta-item">
          <span class="traffic-stat-label traffic-up"><span class="traffic-dot"></span><span data-i18n="dashboard.up"></span></span>
          <strong id="upload-speed">0 KB/s</strong>
        </div>
        <div class="traffic-meta-item">
          <span class="traffic-stat-label traffic-down"><span class="traffic-dot"></span><span data-i18n="dashboard.down"></span></span>
          <strong id="download-speed">0 KB/s</strong>
        </div>
        <div class="traffic-meta-item">
          <span data-i18n="dashboard.total_sent"></span>
          <strong id="total-upload">0 B</strong>
        </div>
        <div class="traffic-meta-item">
          <span data-i18n="dashboard.total_received"></span>
          <strong id="total-download">0 B</strong>
        </div>
        <div class="traffic-meta-control">
          <label class="traffic-select traffic-unit-select">
          <span class="sr-only" data-i18n="dashboard.display_unit"></span>
          <select id="traffic-unit-select" aria-label="" data-i18n-attr="aria-label:dashboard.display_unit">
            <option value="kb" data-i18n="dashboard.unit_kb"></option>
            <option value="mb" data-i18n="dashboard.unit_mb"></option>
            <option value="bytes" data-i18n="dashboard.unit_bytes"></option>
          </select>
          </label>
        </div>
      </div>
      <div class="chart-wrap traffic-chart-wrap">
        <canvas id="traffic-chart" width="960" height="220"></canvas>
      </div>
    </div>
    <div class="traffic-panel traffic-panel-placeholder" data-traffic-panel="disk" hidden></div>
  </article>
</section>

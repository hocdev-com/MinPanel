<section class="topbar" id="dashboard">
  <div class="topbar-main">
    <div class="topbar-item topbar-system-item">
      <i id="topbar-os-icon" class="topbar-os-icon dashboard-icon iconfont icon-linux" aria-hidden="true"></i>
      <span id="topbar-system" class="topbar-text" data-i18n="topbar.system_collecting"></span>
    </div>
    <div class="topbar-item topbar-uptime-item">
      <span><span data-i18n="topbar.uptime_label"></span> <strong id="topbar-uptime">--</strong></span>
    </div>
  </div>

  <div class="top-actions">
    <div class="top-actions-group top-status-group">
      <div class="top-language-switcher">
        <button
          class="top-mini-button top-mini-button-translate"
          id="top-language-button"
          type="button"
          aria-label=""
          aria-haspopup="menu"
          aria-expanded="false"
          data-i18n-attr="aria-label:actions.change_language;title:actions.change_language"
        >
          <span class="top-mini-button-icon" aria-hidden="true">
            <span class="dashboard-icon icon-top-language"></span>
          </span>
        </button>
        <div class="top-theme-popover top-language-popover" id="top-language-popover" role="menu" hidden>
          <div class="top-theme-list top-language-list" id="top-language-list">
            <button class="top-theme-option" type="button" disabled data-i18n="language.loading"></button>
          </div>
        </div>
      </div>
      <button
        class="top-icon-button top-color-mode-button"
        id="top-color-mode-button"
        type="button"
        aria-label=""
        aria-pressed="false"
        data-i18n-attr="aria-label:actions.switch_dark;title:actions.switch_dark"
      >
        <span class="dashboard-icon icon-top-brightness" aria-hidden="true"></span>
      </button>
      <div class="top-theme-switcher">
        <button
          class="top-mini-button top-theme-button"
          id="top-theme-button"
          type="button"
          aria-label="Change interface theme"
          aria-haspopup="menu"
          aria-expanded="false"
        >
          <span class="top-theme-button-icon" aria-hidden="true">
            <span class="dashboard-icon icon-top-palette"></span>
          </span>
        </button>
        <div class="top-theme-popover" id="top-theme-popover" role="menu" hidden>
          <div class="top-theme-list" id="top-theme-list">
            <button class="top-theme-option" type="button" disabled>Loading themes...</button>
          </div>
        </div>
      </div>
      <span class="top-actions-divider" aria-hidden="true"></span>
      <span class="top-version-label">v11.1.0</span>
    </div>
    <div class="top-actions-group">
      <a class="top-action-link" href="/software">
        <span class="top-action-link-icon-wrap" aria-hidden="true">
          <span class="dashboard-icon top-action-link-icon icon-top-update"></span>
        </span>
        <span data-i18n="topbar.update"></span>
      </a>
      <a class="top-action-link" href="/website">
        <span class="top-action-link-icon-wrap" aria-hidden="true">
          <span class="dashboard-icon top-action-link-icon icon-top-fix"></span>
        </span>
        <span data-i18n="topbar.fix"></span>
      </a>
      <a class="top-action-link" href="/traffic">
        <span class="top-action-link-icon-wrap" aria-hidden="true">
          <span class="dashboard-icon top-action-link-icon icon-top-restart"></span>
        </span>
        <span data-i18n="topbar.restart"></span>
      </a>
    </div>
  </div>
</section>

<section class="topbar" id="dashboard">
  <div class="topbar-main">
    <div class="topbar-item topbar-system-item">
      <i id="topbar-os-icon" class="topbar-os-icon dashboard-icon iconfont icon-linux" aria-hidden="true"></i>
      <span id="topbar-system" class="topbar-text">System: Collecting realtime panel information...</span>
    </div>
    <div class="topbar-item topbar-uptime-item">
      <span class="topbar-icon" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10" cy="10" r="6"></circle>
          <path d="M10 6.5v4l2.5 1.5"></path>
        </svg>
      </span>
      <span>Up Time: <strong id="topbar-uptime">--</strong></span>
    </div>
  </div>

  <div class="top-actions">
    <div class="top-actions-group top-status-group">
      <span class="top-version-label">v11.1.0</span>
      <div class="top-theme-switcher">
        <button
          class="top-mini-button top-theme-button"
          id="top-theme-button"
          type="button"
          aria-label="Change interface theme"
          aria-haspopup="menu"
          aria-expanded="false"
        >
          <span class="top-theme-button-icon" aria-hidden="true">
            <span class="dashboard-icon icon-top-theme"></span>
          </span>
        </button>
        <div class="top-theme-popover" id="top-theme-popover" role="menu" hidden>
          <div class="top-theme-list" id="top-theme-list">
            <button class="top-theme-option" type="button" disabled>Loading themes...</button>
          </div>
        </div>
      </div>
    </div>
    <div class="top-actions-group">
      <a class="top-action-link" href="/software">
        <span class="dashboard-icon top-action-link-icon icon-top-update" aria-hidden="true"></span>
        <span>Update</span>
      </a>
      <a class="top-action-link" href="/website">
        <span class="dashboard-icon top-action-link-icon icon-top-fix" aria-hidden="true"></span>
        <span>Fix</span>
      </a>
      <a class="top-action-link" href="/traffic">
        <span class="dashboard-icon top-action-link-icon icon-top-restart" aria-hidden="true"></span>
        <span>Restart</span>
      </a>
    </div>
  </div>
</section>
